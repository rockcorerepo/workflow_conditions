name: reuse 
on:
    workflow_call: 
        inputs:
          artifact-name:
            description: required file 
            default: dist 
            type: string     
        outputs:
          results:
            value: jobs.outputs.outcome
               
jobs:
  deploy:
    outputs:
      outcome:  steps.outid.outputs.myname
    runs-on: ubuntu-latest
    steps:
      - name: get artifacts 
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
      - name: list files 
        run: ls
      - name: display output 
        run: echo "displaying output"
      - name: print output  
        id: outid
        run: echo "myname:rockybhai" >> "$GITHUB_OUTPUT"
      